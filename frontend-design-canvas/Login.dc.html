<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Work+Sans:wght@400;500;600;700&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --ink: #141414;
      --paper: #FFFFFF;
      --card: #F4F2ED;
      --line: #C7C2B4;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Work Sans', system-ui, -apple-system, sans-serif; color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; }
    h1 { font-family: 'Archivo', system-ui, sans-serif; margin: 0; font-weight: 900; letter-spacing: -0.01em; }
    p { margin: 0; }
    a { color: var(--ink); text-decoration: none; }
    .label { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; }
    label { font-size: 14px; font-weight: 700; color: var(--ink); }
    input { font-family: 'Work Sans', sans-serif; font-size: 15px; padding: 13px 14px; border: 2px solid var(--line); border-radius: 2px; color: var(--ink); outline: none; width: 100%; }
    input:focus { border-color: var(--ink); }
  </style>
</helmet>

<div style="width:100%; min-height:900px; background:var(--paper); display:flex; flex-direction:column;">

  <!-- NAV -->
  <div style="display:flex; justify-content:space-between; align-items:center; height:80px; padding:0 64px; border-bottom:3px solid var(--ink);">
    <div style="font-family:'Archivo',sans-serif; font-size:26px; font-weight:900;">sqftex</div>
    <div style="font-size:15px; font-weight:600;">New to sqftex? <a href="#" style="color:{{primary}}; font-weight:700;">Get started</a></div>
  </div>

  <!-- CONTENT -->
  <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:64px;">
    <div style="display:flex; flex-direction:column; gap:28px; width:100%; max-width:400px;">

      <div style="display:flex; flex-direction:column; gap:8px;">
        <div class="label">Welcome back</div>
        <h1 style="font-size:36px;">LOG IN</h1>
      </div>

      <div style="display:flex; flex-direction:column; gap:18px;">
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label>Email</label>
          <input type="email" placeholder="you@company.com" />
        </div>

        <div style="display:flex; flex-direction:column; gap:6px;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label>Password</label>
            <a href="#" style="font-size:13px; font-weight:600; color:var(--ink); opacity:0.65;">Forgot password?</a>
          </div>
          <div style="position:relative; display:flex; align-items:center;">
            <input type="{{passwordType}}" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" style="padding-right:44px;" />
            <button onClick="{{toggleShow}}" style="position:absolute; right:10px; background:none; border:none; padding:6px; display:flex; align-items:center;">
              <sc-if value="{{showPassword}}" hint-placeholder-val="{{false}}">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>
              </sc-if>
              <sc-if value="{{hidePassword}}" hint-placeholder-val="{{true}}">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </sc-if>
            </button>
          </div>
        </div>

        <button style="margin-top:6px; padding:15px 24px; border-radius:2px; border:2px solid transparent; font-size:16px; font-weight:700; color:#fff; background:{{primary}}; width:100%;">Log in</button>
      </div>

    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"primary":{"editor":"color","default":"#1B5E3F","options":["#1B5E3F","#124A31","#E8871E","#141414"],"section":"Brand"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { showPassword: false };
  }
  renderVals() {
    const primary = this.props.primary ?? '#1B5E3F';
    const show = this.state.showPassword;
    return {
      primary,
      passwordType: show ? 'text' : 'password',
      showPassword: show,
      hidePassword: !show,
      toggleShow: () => this.setState({ showPassword: !this.state.showPassword })
    };
  }
}
</script>
</body>
</html>
