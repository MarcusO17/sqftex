<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Work+Sans:wght@400;500;600;700&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --ink: #141414;
      --paper: #FFFFFF;
      --card: #F4F2ED;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Work Sans', system-ui, -apple-system, sans-serif; color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; }
    h1, h3 { font-family: 'Archivo', system-ui, sans-serif; margin: 0; font-weight: 900; letter-spacing: -0.01em; }
    p { margin: 0; }
    a { color: var(--ink); text-decoration: none; }
    .label { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: var(--ink); }
    .role-card { text-align: left; border-radius: 2px; padding: 32px; cursor: pointer; }
  </style>
</helmet>

<div style="width:100%; min-height:900px; background:var(--paper); display:flex; flex-direction:column;">

  <!-- NAV -->
  <div style="display:flex; justify-content:space-between; align-items:center; height:80px; padding:0 64px; border-bottom:3px solid var(--ink);">
    <div style="font-family:'Archivo',sans-serif; font-size:26px; font-weight:900;">sqftex</div>
    <div style="font-size:15px; font-weight:600;">Already have an account? <a href="#" style="color:{{primary}}; font-weight:700;">Log in</a></div>
  </div>

  <!-- CONTENT -->
  <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:40px; padding:64px;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center;">
      <div class="label">Get started</div>
      <h1 style="font-size:40px;">WHICH BEST DESCRIBES YOU?</h1>
      <p style="font-size:16px; font-weight:500;">You can switch roles later — one account covers both listing and booking.</p>
    </div>

    <div style="display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:24px; max-width:760px; width:100%;">

      <div class="role-card" style="{{seekerCardStyle}}" onClick="{{pickSeeker}}">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="{{seekerIconColor}}" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
          <sc-if value="{{isSeeker}}" hint-placeholder-val="{{false}}">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6" stroke="{{primary}}" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </sc-if>
        </div>
        <h3 style="font-size:22px; margin-top:22px;">I NEED STORAGE SPACE</h3>
        <p style="font-size:14px; line-height:1.6; margin-top:10px; color:{{seekerTextColor}};">Browse and book verified space by the day or month.</p>
      </div>

      <div class="role-card" style="{{ownerCardStyle}}" onClick="{{pickOwner}}">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="{{ownerIconColor}}" stroke-width="2"><rect x="3" y="9" width="18" height="12" rx="1"/><path d="M7 9V6a5 5 0 0110 0v3"/><path d="M9 21v-5h6v5"/></svg>
          <sc-if value="{{isOwner}}" hint-placeholder-val="{{false}}">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6" stroke="{{secondary}}" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </sc-if>
        </div>
        <h3 style="font-size:22px; margin-top:22px;">I HAVE SPACE TO LIST</h3>
        <p style="font-size:14px; line-height:1.6; margin-top:10px; color:{{ownerTextColor}};">List spare space and start earning from it.</p>
      </div>

    </div>

    <button onClick="{{continue}}" style="{{continueStyle}}">{{continueLabel}}</button>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"primary":{"editor":"color","default":"#1B5E3F","options":["#1B5E3F","#124A31","#E8871E","#141414"],"section":"Brand"},"secondary":{"editor":"color","default":"#E8871E","options":["#E8871E","#C96F12","#1B5E3F","#141414"],"section":"Brand"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { role: null };
  }
  renderVals() {
    const primary = this.props.primary ?? '#1B5E3F';
    const secondary = this.props.secondary ?? '#E8871E';
    const ink = '#141414';
    const role = this.state.role;
    const isSeeker = role === 'seeker';
    const isOwner = role === 'owner';

    const hasRole = !!role;
    const label = role === 'seeker' ? 'CONTINUE AS A SPACE SEEKER'
      : role === 'owner' ? 'CONTINUE AS A SPACE OWNER'
      : 'CONTINUE';

    return {
      primary,
      secondary,
      isSeeker,
      isOwner,
      seekerCardStyle: `border:3px solid ${ink}; background:${isSeeker ? primary : '#FFFFFF'};`,
      ownerCardStyle: `border:3px solid ${ink}; background:${isOwner ? secondary : '#FFFFFF'};`,
      seekerIconColor: isSeeker ? '#fff' : ink,
      ownerIconColor: isOwner ? ink : ink,
      seekerTextColor: isSeeker ? 'rgba(255,255,255,0.9)' : ink,
      ownerTextColor: ink,
      continueLabel: label,
      continueStyle: `padding:16px 36px; border-radius:2px; border:3px solid ${ink}; font-size:16px; font-weight:700; color:${hasRole ? '#fff' : ink}; background:${hasRole ? ink : 'transparent'}; cursor:${hasRole ? 'pointer' : 'not-allowed'}; min-width:300px;`,
      pickSeeker: () => this.setState({ role: 'seeker' }),
      pickOwner: () => this.setState({ role: 'owner' }),
      continue: () => { if (hasRole) this.setState({ role }); }
    };
  }
}
</script>
</body>
</html>
