<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Work+Sans:wght@400;500;600;700&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --ink: #141414;
      --paper: #FFFFFF;
      --card: #F4F2ED;
      --line: #C7C2B4;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Work Sans', system-ui, -apple-system, sans-serif; color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; }
    h3 { font-family: 'Archivo', system-ui, sans-serif; margin: 0; font-weight: 900; letter-spacing: -0.01em; }
    p { margin: 0; }
    a { color: var(--ink); text-decoration: none; }
    .nav-link { font-size: 16px; font-weight: 600; color: var(--ink); }
    .nav-link:hover { color: #124A31; }
    .label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; }
    .chip { font-size: 14px; font-weight: 700; padding: 9px 18px; border-radius: 2px; cursor: pointer; white-space: nowrap; }
    .search-input { font-family: 'Work Sans', sans-serif; font-size: 14px; padding: 11px 14px 11px 40px; border: 2px solid var(--line); border-radius: 2px; width: 260px; outline: none; }
    .search-input:focus { border-color: var(--ink); }
    .listing-card { background: #fff; border: 3px solid var(--ink); border-radius: 2px; overflow: hidden; cursor: pointer; }
  </style>
</helmet>

<div style="width:100%; min-height:1100px; background:var(--paper);">

  <!-- NAV -->
  <div style="display:flex; justify-content:space-between; align-items:center; height:80px; padding:0 64px; border-bottom:3px solid var(--ink);">
    <div style="display:flex; align-items:center; gap:44px;">
      <div style="font-family:'Archivo',sans-serif; font-size:26px; font-weight:900;">sqftex</div>
      <div style="display:flex; gap:28px;">
        <a href="#" class="nav-link" style="color:{{primary}};">Browse</a>
        <a href="#" class="nav-link">My bookings</a>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:20px;">
      <a href="#" style="font-size:15px; font-weight:700; color:var(--ink); border:2px solid var(--ink); padding:10px 18px; border-radius:2px;">List a space</a>
      <div style="width:36px; height:36px; border-radius:50%; background:{{secondary}}; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:var(--ink);">JT</div>
    </div>
  </div>

  <!-- FILTER BAR -->
  <div style="display:flex; justify-content:space-between; align-items:center; gap:24px; padding:24px 64px; border-bottom:3px solid var(--ink); flex-wrap:wrap;">
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <sc-for list="{{chips}}" as="chip" hint-placeholder-count="6">
        <div class="chip" style="{{chip.style}}" onClick="{{chip.pick}}">{{chip.label}}</div>
      </sc-for>
    </div>
    <div style="position:relative; display:flex; align-items:center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2" style="position:absolute; left:13px;"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <input class="search-input" placeholder="Search by area, e.g. Petaling Jaya" />
    </div>
  </div>

  <!-- RESULTS -->
  <div style="padding:40px 64px;">
    <p style="font-size:14px; font-weight:600; margin-bottom:24px;">{{resultCount}} SPACES AVAILABLE</p>
    <div style="display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:24px;">
      <sc-for list="{{listings}}" as="item" hint-placeholder-count="6">
        <div class="listing-card">
          <div style="height:160px; background:{{item.iconBg}}; display:flex; align-items:center; justify-content:center; border-bottom:3px solid var(--ink);">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><rect x="3" y="9" width="18" height="12" rx="1"/><path d="M7 9V6a5 5 0 0110 0v3"/></svg>
          </div>
          <div style="padding:18px; display:flex; flex-direction:column; gap:6px;">
            <div class="label" style="color:{{item.iconBg}};">{{item.category}}</div>
            <h3 style="font-size:17px;">{{item.title}}</h3>
            <p style="font-size:14px; font-weight:500;">{{item.address}}</p>
            <p style="font-size:14px; font-weight:600; margin-top:6px;">{{item.size}} sqft &middot; {{item.price}}</p>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"primary":{"editor":"color","default":"#1B5E3F","options":["#1B5E3F","#124A31","#E8871E","#141414"],"section":"Brand"},"secondary":{"editor":"color","default":"#E8871E","options":["#E8871E","#C96F12","#1B5E3F","#141414"],"section":"Brand"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { category: 'All' };
  }
  renderVals() {
    const primary = this.props.primary ?? '#1B5E3F';
    const secondary = this.props.secondary ?? '#E8871E';
    const ink = '#141414';
    const active = this.state.category;

    const chipNames = ['All', 'Self-storage', 'Warehouse bay', 'Retail backroom', 'Vehicle & boat', 'Office storage'];
    const chips = chipNames.map((name) => {
      const isActive = active === name;
      return {
        label: name,
        style: `border:2px solid ${ink}; background:${isActive ? ink : '#FFFFFF'}; color:${isActive ? '#fff' : ink};`,
        pick: () => this.setState({ category: name })
      };
    });

    const allListings = [
      { title: 'Warehouse Bay — Petaling Jaya', address: 'Jalan Universiti, Petaling Jaya', size: 320, price: 'RM 680/month', category: 'Warehouse bay', iconBg: primary },
      { title: 'Spare Storeroom — Subang Jaya', address: 'SS15, Subang Jaya', size: 90, price: 'RM 25/day', category: 'Self-storage', iconBg: secondary },
      { title: 'Retail Backroom — Bangsar', address: 'Jalan Telawi, Bangsar', size: 150, price: 'RM 420/month', category: 'Retail backroom', iconBg: primary },
      { title: 'Covered Garage Bay — Cheras', address: 'Taman Connaught, Cheras', size: 200, price: 'RM 15/day', category: 'Vehicle & boat', iconBg: secondary },
      { title: 'Office Storage Room — KLCC', address: 'Jalan Ampang, Kuala Lumpur', size: 60, price: 'RM 300/month', category: 'Office storage', iconBg: primary },
      { title: 'Mini Warehouse — Shah Alam', address: 'Seksyen 15, Shah Alam', size: 500, price: 'RM 950/month', category: 'Warehouse bay', iconBg: secondary }
    ];

    const listings = active === 'All' ? allListings : allListings.filter((l) => l.category === active);

    return {
      primary,
      secondary,
      chips,
      listings,
      resultCount: listings.length
    };
  }
}
</script>
</body>
</html>
