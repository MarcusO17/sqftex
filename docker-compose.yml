version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sqftex
      POSTGRES_USER: sqftex
      POSTGRES_PASSWORD: sqftex
    ports:
      - "5432:5432"
    volumes:
      - sqftex_pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  web:
    build: ./backend
    command: sh -c "npx prisma migrate deploy && npm start"
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://sqftex:sqftex@db:5432/sqftex?schema=public
    depends_on:
      - db
      - redis
volumes:
  sqftex_pgdata:
