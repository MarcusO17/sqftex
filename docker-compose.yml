version: "3.9"
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: sqftex
      POSTGRES_USER: sqftex
      POSTGRES_PASSWORD: sqftex
    ports:
      - "5432:5432"
    volumes:
      - sqftex_pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  web:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
volumes:
  sqftex_pgdata:
